name: Application regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check reproducibility and repository files
        run: python tests/repository.py
      - name: Validate Windows Terminal against Microsoft's schema
        run: |
          python -m pip install jsonschema
          curl --fail --location --retry 2 https://raw.githubusercontent.com/microsoft/terminal/main/doc/cascadia/profiles.schema.json -o "$RUNNER_TEMP/terminal-schema.json"
          python tests/windows_terminal.py "$RUNNER_TEMP/terminal-schema.json"
  neovim-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Download official Neovim
        env:
          VERSION: ${{ matrix.version }}
        run: |
          curl --fail --location --retry 2 "https://github.com/neovim/neovim/releases/download/$VERSION/nvim-linux-x86_64.tar.gz" -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Check loading, reloading and both variants
        run: nvim --headless -u NONE -l tests/headless.lua
      - name: Check effective highlight colors and editing states
        run: nvim --headless -u NONE -l tests/highlights.lua
      - name: Install plugin fixtures
        if: ${{ !cancelled() }}
        run: |
          git clone --depth=1 https://github.com/nvim-lualine/lualine.nvim.git "$RUNNER_TEMP/lualine"
          git clone --depth=1 https://github.com/nvim-lua/plenary.nvim.git "$RUNNER_TEMP/plenary"
          git clone --depth=1 --branch 0.1.8 https://github.com/nvim-telescope/telescope.nvim.git "$RUNNER_TEMP/telescope"
      - name: Install remaining plugin fixtures on current Neovim
        if: ${{ !cancelled() && matrix.version == 'stable' }}
        run: |
          git clone --depth=1 https://github.com/stevearc/oil.nvim.git "$RUNNER_TEMP/oil"
          git clone --depth=1 https://github.com/MunifTanjim/nui.nvim.git "$RUNNER_TEMP/nui"
          git clone --depth=1 --branch v3.x https://github.com/nvim-neo-tree/neo-tree.nvim.git "$RUNNER_TEMP/neo-tree"
          git clone --depth=1 https://github.com/folke/which-key.nvim.git "$RUNNER_TEMP/which-key"
          git clone --depth=1 https://github.com/folke/snacks.nvim.git "$RUNNER_TEMP/snacks"
          git clone --depth=1 https://github.com/lewis6991/gitsigns.nvim.git "$RUNNER_TEMP/gitsigns"
          git clone --depth=1 https://github.com/hrsh7th/nvim-cmp.git "$RUNNER_TEMP/cmp"
          git clone --depth=1 --branch v1 https://github.com/Saghen/blink.cmp.git "$RUNNER_TEMP/blink"
      - name: Check real lualine and Telescope rendering
        if: ${{ !cancelled() }}
        run: nvim --headless -u NONE -l tests/plugins.lua
      - name: Check explorer, completion and utility plugin integration
        if: ${{ !cancelled() && matrix.version == 'stable' }}
        run: nvim --headless -u NONE -l tests/plugin_extras.lua
  terminals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install terminals
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y kitty alacritty xfce4-terminal konsole xvfb dbus-x11 python3-pil shellcheck
      - name: Check Kitty's native configuration parser
        run: kitty +runpy 'import runpy; runpy.run_path("tests/kitty.py", run_name="__main__")'
      - name: Query colors inside the running terminals
        if: ${{ !cancelled() }}
        run: dbus-run-session -- xvfb-run -a python3 tests/terminals.py
      - name: Check capture validation and reject blank frames
        if: ${{ !cancelled() }}
        run: |
          shellcheck scripts/capture.sh
          python3 tests/captures.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: terminal-swatches
          path: test-results/*.png
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official VS Code test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libasound2t64 libgbm1
          npm install --prefix "$RUNNER_TEMP/morello-node" --no-audit --no-fund @vscode/test-electron@2.5.2 vscode-textmate@9.2.0 vscode-oniguruma@2.0.1
      - name: Load both themes and inspect resolved colors and syntax
        env:
          MORELLO_NODE_MODULES: ${{ runner.temp }}/morello-node/node_modules
        run: xvfb-run -a node tests/vscode.cjs
  ghostty:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Ghostty binary through Homebrew
        run: brew install --cask ghostty
      - name: Validate both variants with Ghostty
        run: |
          /Applications/Ghostty.app/Contents/MacOS/ghostty +version
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config --config-file=ports/ghostty/Morello
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config --config-file="ports/ghostty/Morello Light"
  foot-current:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install current foot from the official Arch repository
        run: pacman -Syu --noconfirm git foot ttf-dejavu
      - uses: actions/checkout@v4
      - name: Check both modern color sections with foot
        run: |
          foot --version
          foot --check-config --config ports/foot/morello.ini
