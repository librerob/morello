name: Update screenshots
on:
  push:
    branches: [main]
    paths:
      - 'palette*.json'
      - 'lua/**'
      - 'colors/**'
      - 'examples/**'
      - 'scripts/capture.*'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install terminal capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb kitty xdotool imagemagick fonts-jetbrains-mono fontconfig libgl1-mesa-dri shellcheck
          curl --fail --location --retry 2 https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Check capture script
        run: shellcheck scripts/capture.sh
      - name: Capture Neovim in Kitty
        run: env -u RUNNER_TEMP -u NVIM_BIN LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args='-screen 0 1600x1000x24' bash scripts/capture.sh
      - name: Commit updated captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/neovim-lua.png assets/neovim-python.png assets/neovim-ui.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update Neovim screenshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
