name: Verify palette
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  contrast-and-ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated files
        run: |
          python scripts/sync_ports.py
          python scripts/sync_extras.py
          python scripts/sync_vim.py
          git diff --exit-code
      - name: Check contrast and port consistency
        run: python scripts/verify.py
      - name: Check extra ports
        run: python scripts/verify_extras.py
  neovim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official stable Neovim
        run: |
          curl --fail --location --retry 2 https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
      - name: Check colorscheme loading and reloading
        run: '"$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u NONE -l tests/headless.lua'
  vim-and-foot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vim and foot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim-nox foot
      - name: Check Vim loading, reloading and variant switching
        run: vim -Nu NONE -n -es -S tests/vim.vim
      - name: Check foot configuration with its native parser
        run: |
          version=$(foot --version | sed -nE 's/^foot version: ([0-9]+)\.([0-9]+).*/\1 \2/p')
          read -r major minor <<< "$version"
          if (( major > 1 || (major == 1 && minor >= 26) )); then
            foot --check-config --config ports/foot/morello.ini
          else
            foot --check-config --config ports/foot/morello-legacy.ini
            foot --check-config --config ports/foot/morello-light-legacy.ini
          fi
