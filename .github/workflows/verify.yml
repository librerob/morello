name: Verify palette
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  contrast-and-ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated files
        run: |
          python scripts/sync_ports.py
          python scripts/sync_extras.py
          python scripts/sync_vim.py
          python scripts/sync_apps.py
          git diff --exit-code
      - name: Check contrast and port consistency
        run: python scripts/verify.py
      - name: Check extra ports
        run: python scripts/verify_extras.py
      - name: Check bat theme settings
        run: python tests/bat.py
  neovim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official stable Neovim
        run: |
          curl --fail --location --retry 2 https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz -o "$RUNNER_TEMP/nvim.tar.gz"
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
      - name: Check colorscheme loading and reloading
        run: '"$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -u NONE -l tests/headless.lua'
  vim-and-foot:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vim and foot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim-nox foot
          vim --version | head -n 3
          foot --version
      - name: Check Vim loading, reloading and variant switching
        run: vim -Nu NONE -n -es -S tests/vim.vim
      - name: Check foot configuration with its native parser
        run: |
          version=$(foot --version | sed -nE 's/^foot version: ([0-9]+)\.([0-9]+).*/\1 \2/p')
          read -r major minor <<< "$version"
          if (( major > 1 || (major == 1 && minor >= 26) )); then
            foot --check-config --config ports/foot/morello.ini
          else
            foot --check-config --config ports/foot/morello-legacy.ini
            foot --check-config --config ports/foot/morello-light-legacy.ini
          fi
  apps:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: doomemacs/themes
          ref: a59202912ad55014e53a685eee6cd94130bdd4fd
          path: .ci/doom-themes
          persist-credentials: false
      - name: Install application test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bat emacs-nox ruby ruby-dev
          sudo gem install --no-document colorls --version 1.5.0
          emacs --version | head -n 1
          batcat --version
      - name: Check Base16 YAML and native colorls loading
        run: ruby tests/apps.rb --colorls
      - name: Check native bat cache and syntax rendering
        if: ${{ !cancelled() }}
        run: python3 tests/bat.py --bat batcat
      - name: Check native Emacs and Doom theme loading
        if: ${{ !cancelled() }}
        env:
          DOOM_THEMES_DIR: ${{ github.workspace }}/.ci/doom-themes
        run: emacs -Q --batch -l tests/emacs.el -f ert-run-tests-batch-and-exit
