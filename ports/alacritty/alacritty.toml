# Morello.
# Standalone color config; also safe to import under [general].
# Keep window opacity at 1.0 to retain the audited contrast ratios.

[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#2B1B23"
foreground = "#E8DDE2"
dim_foreground = "#C0ABB6"
bright_foreground = "#F5EBEF"

[colors.cursor]
text = "#2B1B23"
cursor = "#E8DDE2"

[colors.vi_mode_cursor]
text = "#2B1B23"
cursor = "#ECA994"

[colors.selection]
text = "#E8DDE2"
background = "#573B4B"

[colors.search.matches]
foreground = "#2B1B23"
background = "#D3D59A"

[colors.search.focused_match]
foreground = "#2B1B23"
background = "#A8D8BF"

[colors.hints.start]
foreground = "#2B1B23"
background = "#A8D8BF"

[colors.hints.end]
foreground = "#2B1B23"
background = "#D3D59A"

[colors.footer_bar]
foreground = "#E8DDE2"
background = "#392831"

[colors.line_indicator]
foreground = "#E8DDE2"
background = "#392831"

[colors.normal]
black = "#392831"
red = "#F08F98"
green = "#A8C99D"
yellow = "#E5BF88"
blue = "#A5BECA"
magenta = "#D7ADC3"
cyan = "#9ACDC3"
white = "#D9CBD2"

[colors.bright]
black = "#AA94A0"
red = "#FFACB0"
green = "#C3DEAF"
yellow = "#F3D4A4"
blue = "#C0D6DF"
magenta = "#E8C5D8"
cyan = "#B9E3D8"
white = "#F5EBEF"
