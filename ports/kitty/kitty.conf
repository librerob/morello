# Morello.
# Include this file from kitty.conf; no font or keybinding overrides.
# Keep background_opacity at 1.0 to retain audited contrast ratios.

background #2B1B23
foreground #E8DDE2
cursor #E8DDE2
cursor_text_color #2B1B23
selection_foreground #E8DDE2
selection_background #573B4B

active_border_color #A8D8BF
inactive_border_color #725260
bell_border_color #F08F98

active_tab_foreground #2B1B23
active_tab_background #A8D8BF
inactive_tab_foreground #C0ABB6
inactive_tab_background #34232D
tab_bar_background #2B1B23

url_color #D3D59A

# Marks are available to kittens/marking commands; they are not a search UI.
mark1_foreground #2B1B23
mark1_background #A8D8BF
mark2_foreground #2B1B23
mark2_background #ECA994
mark3_foreground #2B1B23
mark3_background #D7ADC3

# ANSI 0-15: normal, then bright.
color0  #392831
color1  #F08F98
color2  #A8C99D
color3  #E5BF88
color4  #A5BECA
color5  #D7ADC3
color6  #9ACDC3
color7  #D9CBD2
color8  #AA94A0
color9  #FFACB0
color10 #C3DEAF
color11 #F3D4A4
color12 #C0D6DF
color13 #E8C5D8
color14 #B9E3D8
color15 #F5EBEF
