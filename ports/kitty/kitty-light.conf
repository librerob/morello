# Morello Light.
# Include this file from kitty.conf; no font or keybinding overrides.
# Keep background_opacity at 1.0 to retain audited contrast ratios.

background #F8F0F3
foreground #32232B
cursor #32232B
cursor_text_color #F8F0F3
selection_foreground #32232B
selection_background #F4DEEA

active_border_color #286E53
inactive_border_color #D1BBC5
bell_border_color #BD0F55

active_tab_foreground #F8F0F3
active_tab_background #286E53
inactive_tab_foreground #66505D
inactive_tab_background #F2E8ED
tab_bar_background #F8F0F3

url_color #626321

# Marks are available to kittens/marking commands; they are not a search UI.
mark1_foreground #F8F0F3
mark1_background #286E53
mark2_foreground #F8F0F3
mark2_background #783429
mark3_foreground #F8F0F3
mark3_background #97417B

# ANSI 0-15: normal, then bright.
color0  #32232B
color1  #BD0F55
color2  #4D683C
color3  #964E07
color4  #096983
color5  #97417B
color6  #286E65
color7  #EFE4EA
color8  #765A68
color9  #AB235C
color10 #3E6737
color11 #815E17
color12 #3B5E8C
color13 #824175
color14 #246968
color15 #FFF9FB
